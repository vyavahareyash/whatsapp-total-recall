[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-total-recall"
version = "0.3.1"
description = "A Zero-Cost, Privacy-First Conversational Intelligence Engine for WhatsApp (macOS)"
readme = "README.pypi.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]

[project.scripts]
whatsapp-total-recall = "whatsapp_total_recall.cli:main"

[project.urls]
Homepage = "https://github.com/vyavahareyash/whatsapp-total-recall"
Repository = "https://github.com/vyavahareyash/whatsapp-total-recall"
Issues = "https://github.com/vyavahareyash/whatsapp-total-recall/issues"

[tool.hatch.build.targets.wheel]
packages = ["whatsapp_total_recall"]

[tool.hatch.build.targets.sdist]
include = [
    "/whatsapp_total_recall",
    "/apps",
    "/README.md",
    "/README.pypi.md",
    "/AGENT_INSTALL.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["whatsapp_total_recall"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:deepeval"
